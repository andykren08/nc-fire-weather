name: Generate Fire Danger Maps

on:
  schedule:
    # Runs at 04:30 UTC and 16:30 UTC
    - cron: '30 4,16 * * *'
  workflow_dispatch:

# These permissions are required to deploy directly to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Prevents multiple runs from tripping over each other
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libeccodes0 libeccodes-dev libgeos-dev libproj-dev proj-data proj-bin

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install numpy xarray netCDF4 requests matplotlib cartopy metpy ecmwflibs eccodes cfgrib

    - name: Run Fire Danger Script
      run: python fire_danger.py

    - name: Setup Pages
      uses: actions/configure-pages@v4

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: '.' # This grabs your index.html and the generated public/images folder

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
