name: Generate Fire Danger Maps

on:
  schedule:
    # Runs at 04:30 UTC (for 00z run) and 16:30 UTC (for 12z run)
    - cron: '30 4,16 * * *'
  workflow_dispatch: # This allows you to click a button to run it manually anytime

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies (Cartopy & cfgrib)
      run: |
        sudo apt-get update
        sudo apt-get install -y libeccodes0 libeccodes-dev
        sudo apt-get install -y libgeos-dev libproj-dev proj-data proj-bin

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install numpy xarray netCDF4 requests matplotlib cartopy metpy ecmwflibs eccodes cfgrib

    - name: Run Fire Danger Script
      run: python fire_danger.py # <-- CHANGE THIS to your actual python file name

    - name: Commit and Push Generated Images
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add public/images/*
        # Only commit if there are changes
        git diff --quiet && git diff --staged --quiet || (git commit -m "Update fire weather maps" && git push)
